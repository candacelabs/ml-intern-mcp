                                      - oauth_app
                                  name:
                                    type: string
                                    minLength: 1
                                required:
                                  - id
                                  - type
                                additionalProperties: false
                              permissions:
                                type: array
                                items:
                                  type: string
                                  minLength: 1
                              restrictions:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    resource_type:
                                      type: string
                                      const: inference_endpoint
                                    patterns:
                                      type: array
                                      items:
                                        type: string
                                        minLength: 1
                                  required:
                                    - resource_type
                                    - patterns
                                  additionalProperties: false
                            required:
                              - entity
                              - permissions
                            additionalProperties: false
                        global:
                          type: array
                          items:
                            type: string
                            minLength: 1
                        can_read_gated_repos:
                          type: boolean
                      required:
                        - scoped
                      additionalProperties: false
                  required:
                    - type
                    - role
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      type: string
                      const: oauth
                    expires_at:
                      type: string
                      format: date-time
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                    scopes:
                      type: array
                      items:
                        type: string
                        minLength: 1
                  required:
                    - type
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      type: string
                      const: app_token
                    role:
                      type: string
                      minLength: 1
                    entities:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                              - model
                              - dataset
                              - space
                              - bucket
                              - kernel
                              - org
                          name:
                            type: string
                            minLength: 1
                        required:
                          - name
                        additionalProperties: false
                  required:
                    - type
                    - entities
                  additionalProperties: false
                - type: object
                  properties:
                    type:
                      type: string
                      const: other
                    expires_at:
                      type: string
                      format: date-time
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  required:
                    - type
                  additionalProperties: false
          required:
            - status
            - account
            - organizations
            - credential
          additionalProperties: false
        - type: object
          properties:
            status:
              type: string
              const: anonymous
            account:
              type: "null"
            organizations:
              type: array
              items:
