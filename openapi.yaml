# Snapshot generated by scripts/capture-contract.mjs.
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: HuggingChat ML Intern MCP tools
  version: 0.4.39
  description: JSON-RPC tool discovery and invocation for the Hub intern preset. Match a reply to its request ID
    to select its result schema. Each tool exposes MCP content blocks. Tools declaring outputSchema also
    return structuredContent on success. The Jobs operation schemas describe dispatch inputs. Additional
    upstream runtime refinements run when a command is executed.
servers:
  - url: https://huggingface.co
x-mcp-source:
  preset: intern
  npm: "@llmindset/hf-mcp-server@0.4.39"
  huggingChat: https://github.com/huggingface/chat-ui/blob/7fc0f672685331f11317a448f24c1c66b64894c6/src/lib/server/mlAssistant.ts
  capture: tools/list over two in-memory SDK sessions using the published preset. One session is anonymous. One
    has a synthetic verified identity. Discovery uses zero network requests. The authenticated account hint in
    three sandbox argument descriptions is omitted.
x-mcp-stdio:
  framing: One UTF-8 JSON-RPC message per line on stdin and stdout.
  description: Local stdio uses the same initialize, tools/list and tools/call messages and tool schemas.
    Credentials come from the server process. Query parameters, HTTP headers, status codes and the hosted HTTP
    skills resource extension are transport-specific.
x-mcp-local-http:
  transport: Streamable HTTP
  path: /mcp
  defaultOrigin: http://127.0.0.1:8787
  health:
    method: GET
    path: /healthz
  hubCredential:
    in: header
    name: X-HF-Token
    required: false
  description: The standalone listener serves the intern preset per request. The proxy handles gateway
    Authorization. A public-files listener exposes only anonymous hf_fs.
x-mcp-tools:
  create_repo:
    anonymous: false
    title: Create Hugging Face Repository
    description: Create a Hugging Face model, dataset, Space, or bucket repository using an hf:// destination URI.
      Set source_uri to duplicate an existing model, dataset, or Space server-side.
    annotations:
      title: Create Hugging Face Repository
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: true
    inputSchema:
      $ref: "#/components/schemas/CreateRepoInput"
    outputSchema:
      $ref: "#/components/schemas/CreateRepoOutput"
  hf_fs:
    anonymous: true
    title: "Hugging Face Hub: Find, use and view models, datasets, spaces, buckets, papers, documentation and
      collections. Get daily papers reports, and browse trending content. "
    description: >-
      When to use: Hugging Face Hub models, datasets, Spaces, collections, papers, daily papers, today's
      trending models, current paper leaderboard, docs; list and read repository files, model and dataset
      cards (README, license).


      Examples:
        {"operations":[{"cmd":"ls","args":["hf://models/trending","--limit","10"]}]}
        {"operations":[{"cmd":"ls","args":["hf://papers/trending"]}]}
        {"operations":[{"cmd":"ls","args":["hf://papers/daily/latest"]}]}
        {"operations":[{"cmd":"cat","args":["hf://papers/2501.00001/paper.md"]}]}
        {"operations":[{"cmd":"search","args":["hf://models","--tag","base_model:finetune:org/repo"]}]}

      Use hf_fs for Hugging Face Hub filesystem operations. Call it with operations, an array of {cmd, args}
      items; multiple operations may be submitted together.


      Usage:
        {"operations":[{"cmd":"ls","args":["hf://models/org/repo"]}]}

      Grammar; each string below is one args array item:
        ls     URI [--recursive] [--glob GLOB] [--type TYPE] [--sort SORT] [--limit N]
        cat    URI [--offset N] [--max-bytes N]
        attach URI [--max-bytes N]
        stat   URI
        find   URI [--name GLOB] [--path GLOB] [--type TYPE] [--limit N]
        search URI [QUERY] [--type TYPE] [--sort SORT] [--tag TAG] [--kind mcp] [--limit N]

      COMMAND = ls|cat|attach|stat|find|search.

      TYPE = file|dir|repo|bucket|collection|paper|link.

      SORT = createdAt|downloads|likes|lastModified|likes30d|trendingScore|mainSize|id|trending|upvotes.

      URI is a canonical hf:// URI. QUERY and GLOB are each one string.


      Use search for resource discovery, not repository-content search; ls for a known directory, find for
      recursive file discovery by name/path (not file contents), stat for filesystem metadata or an uncertain
      target type, cat for text contents, and attach for a complete JPEG, PNG, or WebP image. When the request
      gives an exact text-file URI, use cat directly; do not add ls or stat first. stat does not read the
      contents of JSON, Markdown, or other text files.


      Search scopes: hf://models[/OWNER], hf://datasets[/OWNER], hf://spaces[/OWNER],
      hf://collections[/OWNER], hf://papers, and hf://docs[/...]. Repository and repository-file scopes are
      not supported: search a resource root or owner scope to discover resources; use find for file discovery
      within a repository or cat for a known text file. Paper and documentation search require QUERY. --tag
      filters models, datasets, and Spaces by Hub tag (repeatable; all must match) and applies only to
      hf://models|datasets|spaces[/OWNER]; omit QUERY when the tag already identifies the target, because
      QUERY also filters repository names. Derived models carry base_model:ID and base_model:RELATION:ID tags,
      where RELATION is finetune, adapter, merge, or quantized. --kind applies only to hf://spaces[/OWNER];
      the only valid --kind value is mcp, which selects MCP Spaces. Tag families are documented at
      hf://README.md.

      Use ls hf://models/trending, hf://datasets/trending, hf://spaces/trending, or hf://papers/trending for
      trending listings.

      hf://papers/ID is a paper directory, not paper text. Use cat hf://papers/ID/paper.md for paper text and
      cat hf://papers/ID/metadata.json for metadata. No preliminary listing is needed for these known paths.
      Use ls hf://papers/ID to discover other resources.

      Omit --limit, --sort, and --type unless the request requires them. Limits and path-specific behavior are
      documented at hf://README.md. Issue one hf_fs call.


      Links: hf://models|datasets|spaces/OWNER/NAME/PATH maps to
      https://huggingface.co[/datasets|/spaces]/OWNER/NAME/resolve/main/PATH (buckets:
      https://huggingface.co/buckets/OWNER/NAME/resolve/PATH); URL-encode each path segment. arXiv ids (for
      example 2502.16161) link papers, models and datasets.
    annotations:
      title: "Hugging Face Hub: Find, use and view models, datasets, spaces, buckets, papers, documentation and
        collections. Get daily papers reports, and browse trending content. "
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: false
      openWorldHint: true
    inputSchema:
      $ref: "#/components/schemas/HfFsInput"
    outputSchema:
      $ref: "#/components/schemas/HfFsOutput"
  hf_fs_write:
    anonymous: false
    title: Hugging Face File Writes
    description: >-
      Write or remove files in Hugging Face repositories and buckets.


      Grammar; each token below is one args array element:
        put URI [--base64] [(-m|--message) MESSAGE] [--description DESCRIPTION]
                [--branch BRANCH] [--create-pr] [--parent-commit SHA]
        rm  URI [(-m|--message) MESSAGE] [--description DESCRIPTION]
                [--branch BRANCH] [--create-pr] [--parent-commit SHA]

      URI must be an hf://models|datasets|spaces|buckets/OWNER/NAME/PATH file URI.

      For put, provide file data in the separate content field. Content is UTF-8 text unless --base64 is
      present.

      Use --create-pr to propose a change when direct repository writes are unavailable or undesirable.

      Branches, pull requests, descriptions, and parent commits are not supported for buckets.

      A URI '@revision' and --branch are equivalent; do not specify conflicting values.

      --parent-commit must be a 40-character Git commit SHA and prevents overwriting concurrent changes.

      No pipes, redirects, shell expansion, or multiple commands.
    annotations:
      title: Hugging Face File Writes
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: false
      openWorldHint: true
    inputSchema:
      $ref: "#/components/schemas/HfFsWriteInput"
    outputSchema:
      $ref: "#/components/schemas/HfFsWriteOutput"
  hf_jobs:
    anonymous: false
    title: Hugging Face Jobs
    description: 'Remote compute on CPU or GPU hardware (e.g. A100, H200) for Hugging Face workflows: run
      Python/UV scripts or Docker containers remotely. Run Python/UV or Docker jobs to deeply analyze Hub
      datasets, repos, traces, models, and large files; compute trends/statistics; run batch
      inference/evaluation; or perform long-running work with installed libraries. Use for dataset/repo
      analysis prompts when local chat inspection is insufficient. Includes submit, logs, inspect, cancel,
      schedule, labels/names, and volume mounting. Minimal run:
      {"operation":"run","args":{"image":"python:3.12","command":["python","-c","print(123)"]}}. Command
      arrays are literal argv; strings tokenize quotes and escaping, not shell execution. For pipes, chaining,
      redirections, or variable expansion, explicitly use ["/bin/sh", "-lc", "..."] only if the image provides
      that shell. Help: {"operation":"run","args":{"help":true}}; full usage: {}. Follow up with logs or
      inspect using args: {"job_id":"<returned job ID>"}.'
    annotations:
      title: Hugging Face Jobs
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: false
      openWorldHint: true
    inputSchema:
      $ref: "#/components/schemas/HfJobsInput"
    outputSchema:
      $ref: "#/components/schemas/HfJobsOutput"
    operations:
      run:
        $ref: "#/components/schemas/HfJobsRunArgs"
      uv:
        $ref: "#/components/schemas/HfJobsUvArgs"
      ps:
        $ref: "#/components/schemas/HfJobsPsArgs"
      logs:
        $ref: "#/components/schemas/HfJobsLogsArgs"
      inspect:
        $ref: "#/components/schemas/HfJobsInspectArgs"
      cancel:
        $ref: "#/components/schemas/HfJobsCancelArgs"
      update-labels:
        $ref: "#/components/schemas/HfJobsUpdateLabelsArgs"
      scheduled update-labels:
        $ref: "#/components/schemas/HfJobsScheduledUpdateLabelsArgs"
      scheduled run:
        $ref: "#/components/schemas/HfJobsScheduledRunArgs"
      scheduled uv:
        $ref: "#/components/schemas/HfJobsScheduledUvArgs"
      scheduled ps:
        $ref: "#/components/schemas/HfJobsScheduledPsArgs"
      scheduled inspect:
        $ref: "#/components/schemas/HfJobsScheduledInspectArgs"
      scheduled delete:
        $ref: "#/components/schemas/HfJobsScheduledDeleteArgs"
      scheduled suspend:
        $ref: "#/components/schemas/HfJobsScheduledSuspendArgs"
      scheduled resume:
        $ref: "#/components/schemas/HfJobsScheduledResumeArgs"
  hf_sandbox:
    anonymous: false
    title: Hugging Face Sandbox
    description: >-
      Create and manage Hugging Face Sandboxes.


      Grammar; each token below is one args array element:
        create [--name NAME] [--image IMAGE] [--flavor FLAVOR] [--timeout DURATION]
               [--namespace NAMESPACE] [--resource-group-id ID] [--forward-hf-token] [--volume SPEC]...
               [--bucket OWNER/NAME] [--bucket-mode ro|rw] [--bucket-mount-path PATH]
        status HANDLE
        terminate HANDLE
        ps HANDLE
        kill HANDLE PROCESS_ID

      HANDLE is returned by create. Volume SPEC is
      hf://[models|datasets|spaces|buckets]/OWNER/NAME[/PATH]:/MOUNT_PATH[:ro|:rw].

      No pipes, redirects, shell expansion, or multiple commands.
    annotations:
      title: Hugging Face Sandbox
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: false
      openWorldHint: true
    inputSchema:
      $ref: "#/components/schemas/HfSandboxInput"
    outputSchema:
      $ref: "#/components/schemas/HfSandboxOutput"
  hf_sandbox_exec:
    anonymous: false
    title: Hugging Face Sandbox Exec
    description: |-
      Run a shell command inside a Hugging Face Sandbox.

      Grammar; each token below is one args array element:
        exec HANDLE SHELL_COMMAND [--workdir PATH] [--stdin TEXT] [--timeout SECONDS]
             [--env NAME=VALUE]... [--detach] [--tag TAG]

      SHELL_COMMAND is one string token and runs via /bin/sh -lc.
      Foreground timeout defaults to 30 seconds and may not exceed 55.
      Detached commands have no timeout unless set. Redirect detached output to a file.
    annotations:
      title: Hugging Face Sandbox Exec
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: false
      openWorldHint: true
    inputSchema:
      $ref: "#/components/schemas/HfSandboxExecInput"
    outputSchema:
      $ref: "#/components/schemas/HfSandboxExecOutput"
  hf_sandbox_fs:
    anonymous: false
    title: Hugging Face Sandbox Files
    description: |-
      Read, write and manage files inside a Hugging Face Sandbox.

      Grammar; each token below is one args array element:
        ls HANDLE PATH
        cat HANDLE PATH [--offset N] [--max-bytes N]
        stat HANDLE PATH
        write HANDLE PATH (--text TEXT|--base64 BASE64)
        rm HANDLE PATH [(-r|-R|--recursive)]
        mkdir HANDLE PATH

      PATH is an absolute path inside the sandbox. cat defaults to 20000 bytes and allows at most 100000.
    annotations:
      title: Hugging Face Sandbox Files
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: false
      openWorldHint: true
    inputSchema:
      $ref: "#/components/schemas/HfSandboxFsInput"
    outputSchema:
      $ref: "#/components/schemas/HfSandboxFsOutput"
  hf_whoami:
    anonymous: true
    title: Hugging Face User Info
    description: Inspect the current Hugging Face authentication context, including the account, visible
      organization memberships, and credential access details. Read-only and never returns credential values.
    annotations:
      title: Hugging Face User Info
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    inputSchema:
      $ref: "#/components/schemas/HfWhoamiInput"
    outputSchema:
      $ref: "#/components/schemas/HfWhoamiOutput"
  hub_repo_details:
    anonymous: true
    title: Hub Repository Details
    description: "Get details for one or more Hugging Face repos (model, dataset, or space): card metadata,
      license, downloads, files, Space hardware/status, dataset configs, splits, columns and preview rows.
      Auto-detects type unless specified. For datasets, use operations: overview, dataset_structure,
      dataset_preview. Use dataset_structure first to discover configs, splits, sizes, and schema. Use
      dataset_preview only when config and split are known, unless the dataset has a single config/split."
    annotations:
      title: Hub Repository Details
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: false
      openWorldHint: true
    inputSchema:
      $ref: "#/components/schemas/HubRepoDetailsInput"
