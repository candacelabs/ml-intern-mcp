                    permissions:
                      type: object
                      properties:
                        scoped:
                          type: array
                          items:
                            type: object
                            properties:
                              entity:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    minLength: 1
                                  type:
                                    type: string
                                    enum:
                                      - model
