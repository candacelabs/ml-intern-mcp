    HubRepoDetailsInput:
      type: object
      properties:
        repo_ids:
          minItems: 1
          maxItems: 10
          type: array
          items:
            type: string
            minLength: 1
          description: Repo IDs for (models|dataset/space) - usually in author/name format (e.g. openai/gpt-oss-120b)
        repo_type:
          description: Specify lookup type; otherwise auto-detects
          type: string
          enum:
            - model
            - dataset
            - space
        operations:
          description: Details to return. Defaults to ["overview"]. For datasets, prefer ["overview",
            "dataset_structure"] first; then call ["dataset_preview"] with config and split.
          type: array
          items:
            type: string
            enum:
              - overview
              - dataset_structure
              - dataset_preview
        config:
          description: Dataset Viewer config. Required for dataset_preview when the dataset has multiple config/split
            options. Discover via dataset_structure.
          type: string
        split:
          description: Dataset Viewer split. Required for dataset_preview when the dataset has multiple config/split
            options. Discover via dataset_structure.
          type: string
        offset:
          description: Row offset for dataset_preview. Defaults to 0.
          type: integer
          minimum: 0
          maximum: 9007199254740991
        limit:
          description: Row count for dataset_preview. Defaults to 5 and is clamped to 1-100.
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - repo_ids
      $schema: https://json-schema.org/draft/2020-12/schema
    HfJobsRunArgs:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        name:
          description: Job name, an alias for labels.name. Do not provide both.
          type: string
          maxLength: 100
          pattern: ^[a-zA-Z0-9_-]*$
        labels:
          description: "Job labels. Keys and values: max 100 characters; alphanumeric, dash, underscore."
          type: object
          propertyNames:
            type: string
            maxLength: 100
            pattern: ^[a-zA-Z0-9_-]*$
          additionalProperties:
            type: string
            maxLength: 100
            pattern: ^[a-zA-Z0-9_-]*$
        namespace:
          description: Target namespace (username or organization). Defaults to current user.
          type: string
        resource_group_id:
          description: Enterprise resource group ID for billing attribution. Requires its organization as namespace.
          type: string
        image:
          default: python:3.12
          type: string
          description: Docker image or HF Space URL (e.g., "python:3.12" or "hf.co/spaces/user/space")
        command:
          anyOf:
            - type: string
            - type: array
              items:
                type: string
          description: Command to execute. Arrays are literal argv (recommended, e.g., ["python", "script.py"]); no
            implicit shell execution. Strings tokenize quotes and escaping, not shell execution; shell
            operators are rejected. For pipes, chaining, redirections, or variable expansion, explicitly use
            ["/bin/sh", "-lc", "..."] only if the image provides that shell. For multiline scripts, use array
            with newlines in arguments.
        flavor:
          default: cpu-basic
          description: Hardware flavor, e.g. cpu-basic, cpu-upgrade, cpu-performance, cpu-xl, t4-small, t4-medium, l4x1,
            l4x4, l40sx1, l40sx4, l40sx8, a10g-small, a10g-large, a10g-largex2, a10g-largex4, a100-large,
            a100x4, a100x8, h200, h200x2, h200x4, h200x8, rtx-pro-6000, rtx-pro-6000x2, rtx-pro-6000x4,
            rtx-pro-6000x8. Other flavors the Jobs API accepts also work.
          type: string
          minLength: 1
        env:
          description: Environment variables as key-value pairs
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
        secrets:
          description: Secrets as key-value pairs. Use HF_TOKEN=$HF_TOKEN to include your token
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
        timeout:
          default: 30m
          description: 'Max duration (e.g., "5m", "2h", "30s"). Default: 30m'
          type: string
        volumes:
          description: 'Volume mounts using hf:// URLs. Format: hf://TYPE/OWNER/NAME[/PATH]:/MOUNT_PATH[:ro|:rw]. TYPE
            is models, datasets, spaces, or buckets. Examples: ["hf://datasets/org/ds:/data:ro",
            "hf://buckets/org/b:/output"].'
          type: array
          items:
            type: string
        detach:
          default: false
          description: If true, return immediately with job ID. If false (default), tail logs for up to 10 seconds.
          type: boolean
      required:
        - command
