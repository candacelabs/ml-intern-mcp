paths:
  /mcp:
    post:
      operationId: postMcpMessage
      summary: Send an ML Intern MCP request or notification
      description: "Send Accept: application/json, text/event-stream. The bouquet selects intern. Anonymous access
        exposes the three tools marked anonymous. HuggingChat also sets the login query marker, which requires
        a bearer credential at initialization. A signed-in account can discover the other tools. Hub
        permissions govern individual actions."
      security:
        - {}
        - HuggingFaceBearer: []
      parameters:
        - in: query
          name: bouquet
          required: true
          schema:
            type: string
            const: intern
        - in: query
          name: login
          allowEmptyValue: true
          schema:
            type: string
          description: Presence of this marker requires authentication, as in ?login&bouquet=intern.
        - in: header
          name: MCP-Protocol-Version
          schema:
            type: string
          description: Send the negotiated version on requests after initialization.
        - in: header
          name: Mcp-Session-Id
          schema:
            type: string
          description: When initialization supplies a session ID, send it on subsequent requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpClientMessage"
      responses:
        "200":
          description: JSON-RPC response on this JSON-mode endpoint. Its ID correlates it with the request.
          headers:
            Mcp-Session-Id:
              description: May be returned during initialization.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpResponse"
        "202":
          description: Notification accepted.
        "400":
          description: Invalid MCP request or unsupported protocol version.
        "401":
          description: Authentication required or rejected.
          headers:
            WWW-Authenticate:
              schema:
                type: string
        "403":
          description: Access denied.
        "406":
          description: The Accept header must include both application/json and text/event-stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcError"
components:
  securitySchemes:
    HuggingFaceBearer:
      type: http
      scheme: bearer
  schemas:
    CreateRepoInput:
      type: object
      properties:
        uri:
          type: string
          minLength: 1
          description: Destination repo URI in the form hf://models|datasets|spaces|buckets/OWNER/NAME.
        source_uri:
          description: Optional source repo URI to duplicate, in the form hf://models|datasets|spaces/OWNER/NAME. Must
            use the same repo type as uri.
          type: string
          minLength: 1
        private:
          description: Visibility for the new repo. For duplication, omit to preserve the source visibility; set true
            for private or false for public.
          type: boolean
        sdk:
          description: Space SDK for new empty Spaces. When duplicating (source_uri set), the Space keeps the source
            sdk; omit sdk or pass the same value.
          type: string
          enum:
            - streamlit
            - gradio
            - docker
            - static
        hardware:
          description: "Space hardware to start on, for new or duplicated Spaces only (rejected for other repo types).
            Omit for the free cpu-basic. Examples: cpu-upgrade, zero-a10g, t4-small, t4-medium, l4x1, l4x4,
            l40sx1, l40sx4, l40sx8, a10g-small, a10g-large, a10g-largex2, a10g-largex4, a100-large, a100x4,
            a100x8, rtx-pro-6000, rtx-pro-6000x2, rtx-pro-6000x4, rtx-pro-6000x8. Use zero-a10g for ZeroGPU,
            which needs sdk gradio (the default for new ZeroGPU Spaces) and a PRO account (or a
            Team/Enterprise plan for an org-owned Space). suggested_hardware in the README does NOT set the
            hardware; only this parameter does. Paid flavors bill the owner from creation."
          type: string
          minLength: 1
      required:
        - uri
      $schema: https://json-schema.org/draft/2020-12/schema
    CreateRepoOutput:
      type: object
      properties:
        action:
          type: string
          enum:
            - created
            - duplicated
        uri:
          type: string
        url:
          type: string
        repo:
          type: string
        repo_type:
          type: string
          enum:
            - model
            - dataset
            - space
            - bucket
        id:
          type: string
        source_uri:
          type: string
        source_repo:
          type: string
        sdk:
          type: string
          enum:
            - streamlit
            - gradio
            - docker
            - static
        hardware:
          type: object
          properties:
            requested:
              type: string
            current:
              type: string
            stage:
              type: string
            confirmed:
              type: boolean
          required:
            - requested
            - confirmed
          additionalProperties: false
      required:
        - action
        - uri
        - url
        - repo
        - repo_type
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    CreateRepoCallResult:
      allOf:
        - $ref: "#/components/schemas/CallToolResult"
        - anyOf:
            - properties:
                structuredContent:
                  $ref: "#/components/schemas/CreateRepoOutput"
              required:
                - structuredContent
            - properties:
                isError:
                  const: true
              required:
                - isError
    HfFsInput:
      type: object
      properties:
        operations:
          minItems: 1
          maxItems: 30
          type: array
          items:
            type: object
            properties:
              cmd:
                type: string
                enum:
                  - ls
                  - cat
                  - attach
                  - stat
                  - find
                  - search
                description: Command to execute.
              args:
                type: array
                items:
                  type: string
                description: Command arguments. First item must be an hf:// URI, not a local path or bare filename. One
                  argument per array item. search discovers resources, not repository contents; use root/owner
                  discovery scopes, find for file discovery, or cat for a known text file. --tag requires
                  hf://models|datasets|spaces[/OWNER]; --kind requires hf://spaces[/OWNER] and its only valid
                  value is mcp.
            required:
              - cmd
              - args
            additionalProperties: false
      required:
        - operations
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    HfFsOutput:
      type: object
      properties:
        results:
          minItems: 1
          maxItems: 30
          type: array
          items:
            oneOf:
              - type: object
                properties:
                  index:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  status:
                    type: string
                    const: success
                  result:
                    type: object
                    properties:
                      uri:
                        type: string
                      op:
                        type: string
                        enum:
                          - ls
                          - cat
                          - attach
                          - stat
                          - find
                          - search
                      entries:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                                - file
                                - dir
                                - repo
                                - bucket
                                - collection
                                - paper
                                - link
                            path:
                              type: string
                            uri:
                              type: string
                            name:
                              type: string
                            target_uri:
                              type: string
                            repo_type:
                              type: string
                              enum:
                                - model
                                - dataset
                                - space
                                - bucket
                            size:
                              type: number
                            total_files:
                              type: number
                            lfs:
